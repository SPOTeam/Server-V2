plugins {
    id "org.springframework.boot"
    id "io.spring.dependency-management"
    id "java"
}

dependencies {
    implementation project(":app:config")

    implementation project(":common:api")
    implementation project(":common:snowflake")
    implementation project(":common:bucket")

    implementation project(":modules:shared")

    implementation project(":modules:auth")
    implementation project(":modules:study")
    implementation project(":modules:member")
    implementation project(":modules:post")
    implementation project(":modules:region")

    implementation project(":modules:member-api")
    implementation project(":modules:auth-api")
    implementation project(":modules:study-api")
    implementation project(":modules:region-api")

    implementation project(":infra:bucket-s3")

//    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.4'

    // Validation
    implementation "org.springframework.boot:spring-boot-starter-validation"

    // Sentry
    implementation("io.sentry:sentry-spring-boot-starter-jakarta:7.9.0")
    implementation("io.sentry:sentry-logback:7.9.0")
}