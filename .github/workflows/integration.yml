name: Integration Testing

on:
  pull_request:
    branches:
      - develop

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Set Sentry auth token
        run: |
          echo "export SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> $GITHUB_ENV
          
      - name: Make application.yml
        run: |
          mkdir -p app/boot/src/main/resources
          echo "${{ secrets.TEST_PROPERTIES }}" > app/boot/src/main/resources/application.yml

      - name: Run tests
        run: |
          ./gradlew test
